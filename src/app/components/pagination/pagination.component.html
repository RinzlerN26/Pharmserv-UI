<div *ngIf="totalItems > 0"
  class="pagination-container d-flex flex-column flex-md-row align-items-center justify-content-between gap-2 mt-3">
  <div class="pagination-info">
    Showing {{ startItem }}–{{ endItem }} of {{ totalItems }}
  </div>

  <div class="d-flex align-items-center gap-3">

    <div class="d-flex align-items-center gap-2">
      <label for="pageSize" class="mb-0">Rows:</label>

      <select id="pageSize" class="form-select form-select-sm" [value]="pageSize" (change)="onPageSizeChange($event)">
        <option *ngFor="let option of pageSizeOptions" [value]="option">
          {{ option }}
        </option>
      </select>
    </div>

    <nav aria-label="Pagination">
      <ul class="pagination pagination-sm mb-0">

        <li class="page-item" [class.disabled]="currentPage === 1">
          <button class="page-link" type="button" (click)="goToPreviousPage()" [disabled]="currentPage === 1">
            Previous
          </button>
        </li>

        <li *ngFor="let page of pages" class="page-item" [class.active]="page === currentPage"
          [class.disabled]="page === '...'">
          <button *ngIf="page !== '...'; else ellipsis" class="page-link" type="button" (click)="goToPage(page)">
            {{ page }}
          </button>

          <ng-template #ellipsis>
            <span class="page-link">...</span>
          </ng-template>
        </li>

        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <button class="page-link" type="button" (click)="goToNextPage()" [disabled]="currentPage === totalPages">
            Next
          </button>
        </li>

      </ul>
    </nav>

  </div>
</div>
