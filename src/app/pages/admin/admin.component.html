<div class="admin-container px-3 py-3">

  <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-3">

    <div>
      <h4 class="mb-1">Admin Dashboard</h4>
      <span class="text-muted">Manage registered users</span>
    </div>

    <app-search placeholder="Search users..." [debounceTime]="400" (searchChange)="onSearchChange($event)"></app-search>

  </div>

  <app-table [displayedColumns]="columns" [data]="users"></app-table>

  <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" [totalItems]="totalItems" [pageSize]="pageSize"
    [pageSizeOptions]="[10, 20, 50]" (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)">
  </app-pagination>

</div>
